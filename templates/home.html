<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #333;
        }
        img {
            margin-top: 20px;
        }
        p {
            font-size: 18px;
            color: #666;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body class="bg-light">
    <main class="container py-5 text-center">
        <h1 class="mb-3">Welcome to Jovian Careers</h1>
        <img src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=1200&q=80" alt="Jovian Careers" class="img-fluid rounded shadow-sm mb-3" style="width: 300px; height: auto;">
        <p class="lead">Join Our Team gdfgfgfg</p>
    <h2>Current Openings</h2>
    {% for job in jobs %}
        <p>{{ loop.index }}. {{ job.title }} - {{ job.location }} - {{ job.salary }}</p>
    {% endfor %}
        <button class="btn btn-primary mt-3">Apply Now</button>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
